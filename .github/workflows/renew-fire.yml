name: 🚀 续一次火

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只检查登录和会话，不发送消息
        required: true
        default: true
        type: boolean
      target_names:
        description: 临时好友名称 JSON；留空时使用仓库 Secret
        required: false
        default: ""
        type: string
      message:
        description: 临时消息内容；留空时使用仓库 Secret 或随机一言
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-auto-spark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    timeout-minutes: 30

    steps:
      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v7

      - name: 安装 unzip (Install unzip)
        run: apt-get update && apt-get install -y unzip

      - name: 安装 Bun (Set up Bun)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装运行时依赖 (Install dependencies)
        run: bun install --production --ignore-scripts

      - name: 续一次火 (Run spark job)
        env:
          DOUYIN_ACCOUNTS: ${{ secrets.DOUYIN_ACCOUNTS }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_TARGET_NAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.target_names || secrets.DOUYIN_TARGET_NAMES }}
          YIYAN_INCLUDE_SOURCE: ${{ secrets.YIYAN_INCLUDE_SOURCE }}
          SPARK_MESSAGE_TEMPLATE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || secrets.SPARK_MESSAGE_TEMPLATE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          AUTO_CLOSE: "true"
          PLAYWRIGHT_HEADLESS: "true"
          MAX_SENDS_PER_RUN: "10"
          SEND_GAP_MIN_SECONDS: "8"
          SEND_GAP_MAX_SECONDS: "15"
        run: bun src/main.ts

      - name: 检查邮件配置 (Check mail configuration)
        id: mail-config
        if: ${{ always() }}
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_ADDRESS" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发送失败邮件 (Send failure email)
        if: ${{ failure() && steps.mail-config.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_HOST || 'smtp.qq.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: ${{ secrets.MAIL_SECURE || 'true' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 抖音续火任务失败
          to: ${{ secrets.MAIL_TO || secrets.MAIL_ADDRESS }}
          from: ${{ secrets.MAIL_ADDRESS }}
          attachments: artifacts/*.png
          body: |
            抖音续火任务执行失败
            仓库：${{ github.repository }}
            运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
